<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6A5B" data-claro="#0E6A5B">
<title>Ozuna Ventas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../iconos/ventas-192.png">
<link rel="apple-touch-icon" href="../iconos/ventas-192.png">
<script>try{var t=localStorage.getItem('ozuna-tema');if(t==='oscuro')document.documentElement.setAttribute('data-theme','dark');else if(t==='claro')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<link rel="stylesheet" href="../shared/estilos.css">
</head>
<body>
<main id="app"><p class="ayuda">Cargando…</p></main>
<div id="carrito"></div>
<div id="navbox"></div>
<noscript>Esta aplicación necesita JavaScript.</noscript>
<script>
/* Red de seguridad: si la app no arranca en 7 segundos, ofrece repararla sin tocar los datos (ventas, cierres). */
setTimeout(function(){ var a = document.getElementById('app'); if(!a || !/Cargando/.test(a.textContent)) return;
  a.innerHTML = '<h1>No terminó de cargar</h1><p class="ayuda">Toca el botón para repararla. No pierdes tus ventas.</p><button class="btn" id="reparar">Reparar y volver a abrir</button>';
  document.getElementById('reparar').onclick = async function(){ try { var rs = await navigator.serviceWorker.getRegistrations(); for(var r of rs) if(r.scope.indexOf('/vendedor/') > -1) await r.unregister();
    var ks = await caches.keys(); for(var k of ks) if(k.indexOf('ozuna-vendedor-') === 0) await caches.delete(k); } catch(e){} location.reload(); }; }, 7000);
</script>
<script type="module" src="app.js"></script>
</body>
</html>
