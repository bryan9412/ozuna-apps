<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6A5B">
<title>Ozuna</title>
<link rel="icon" href="icono-192.png">
<script>try{var t=localStorage.getItem('ozuna-tema');if(t==='oscuro')document.documentElement.setAttribute('data-theme','dark');else if(t==='claro')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<link rel="stylesheet" href="shared/estilos.css">
</head>
<body>
<main>
  <h1>Ozuna</h1>
  <p class="ayuda">Elige quién eres. Después de abrirla una vez con internet, la aplicación funciona sin conexión.</p>
  <a class="btn" href="vendedor/" style="text-decoration:none;text-align:center;line-height:36px">Soy vendedora</a>
  <a class="btn suave" href="dueno/" style="text-decoration:none;text-align:center;line-height:36px">Soy el dueño</a>
  <div class="card" style="margin-top:18px">
    <h3>Para instalarla en el teléfono</h3>
    <p class="ayuda">Abre la que te toca en Chrome, toca los tres puntos y elige «Añadir a pantalla de inicio» o «Instalar aplicación».</p>
  </div>
</main>
</body>
</html>
